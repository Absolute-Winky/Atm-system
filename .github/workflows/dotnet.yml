name: Build and test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'
      - name: Restore
        run: dotnet restore AtmSystem.sln
      - name: Build
        run: dotnet build AtmSystem.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test AtmSystem.sln --configuration Release --no-build --no-restore
